<div class="col-12">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Album Title</th>
                <th>Artist</th>
                <th>Year</th>
                <th>Genre</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="album in albums | orderBy:sortField:sortDescending">
                <td>
                    <in-place-edit field-name='title' input-type='text' input-class='form-control'
                        model=album>{{album.title}}</in-place-edit>
                </td>
                <td>
                    <in-place-edit field-name='artist' input-type='artist' input-class='form-control'
                        model=album>{{album.artist}}</in-place-edit>
                </td>
                <td>
                    <in-place-edit field-name='releaseYear' input-type='text' input-class='form-control'
                        model=album>{{album.releaseYear}}</in-place-edit>
                </td>
                <td>
                    <in-place-edit field-name='genre' input-type='text' input-class='form-control'
                        model=album>{{album.genre}}</in-place-edit>
                </td>
                <td>
                    <div class="dropdown" bootstrap-dropdown>
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="glyphicon glyphicon-cog"></span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" ng-click="updateAlbum(album)">Edit</a></li>
                            <li><a class="dropdown-item" href="#" ng-click="deleteAlbum(album)">Delete</a></li>
                        </ul>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
