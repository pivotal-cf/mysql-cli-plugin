<div class="col-12" id="status" ng-controller="StatusController">
    <div id="alert" ng-show="status">
        <div class="alert alert-dismissible"
            ng-class="{'alert-success': !status.isError, 'alert-danger': status.isError}">
            <button type="button" class="btn-close" ng-click="clearStatus()" aria-label="Close"></button>
            <div class="d-flex align-items-center">
                <span class="glyphicon me-2"
                    ng-class="{'glyphicon-ok': !status.isError, 'glyphicon-remove': status.isError}"></span>
                <span>{{status.message}}</span>
            </div>
        </div>
    </div>
</div>
