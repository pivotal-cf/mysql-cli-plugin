<div id="albums" ng-init="init()">
    <div class="page-header">
        <h1>Albums <small class="text-muted">(v2.0 - Grid Fixed)</small></h1>
        <div>
            <span> [ view as: </span>
            <a href="" ng-click="setAlbumsView('grid')"><span class="glyphicon glyphicon-th"></span></a>
            <a href="" ng-click="setAlbumsView('list')"><span class="glyphicon glyphicon-th-list"></span></a>
            <span> | sort by: </span>
            <a href="" ng-click="sortField='title'">title</a>
            <a href="" ng-click="sortField='artist'">artist</a>
            <a href="" ng-click="sortField='releaseYear'">year</a>
            <a href="" ng-click="sortField='genre'">genre</a>
            <a href="" ng-click="sortDescending=!sortDescending">
                <span class="glyphicon"
                    ng-class="{'glyphicon-chevron-up' : !sortDescending, 'glyphicon-chevron-down' : sortDescending}"></span>
            </a>
            <span> | </span>
            <a href="" ng-click="addAlbum()"><span class="glyphicon glyphicon-plus"></span>add an album</a>
            <span> ] </span>
        </div>
    </div>

    <div class="row">
        <div ng-include src="'templates/status.html'"></div>
    </div>

    <div class="row multi-columns-row">
        <div ng-include src="albumsView" class="d-contents"></div>
    </div>

    <!-- Bootstrap 5 Modal -->
    <div class="modal fade" ng-class="{'show d-block': showModal}" ng-show="showModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" ng-show="modalAction === 'add'">Add an album</h4>
                    <h4 class="modal-title" ng-show="modalAction === 'update'">Edit an album</h4>
                    <button type="button" class="btn-close" ng-click="closeModal()" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form name="albumForm" role="form">
                        <div class="mb-3">
                            <label for="modalTitle" class="form-label">Album Title</label>
                            <input type="text" class="form-control" id="modalTitle" name="title" required
                                ng-model="modalAlbum.title">
                            <div class="form-text text-danger"
                                ng-show="albumForm.title.$invalid && albumForm.title.$touched">Title is required</div>
                        </div>
                        <div class="mb-3">
                            <label for="modalArtist" class="form-label">Artist</label>
                            <input type="text" class="form-control" id="modalArtist" name="artist" required
                                ng-model="modalAlbum.artist">
                            <div class="form-text text-danger"
                                ng-show="albumForm.artist.$invalid && albumForm.artist.$touched">Artist is required
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="modalYear" class="form-label">Release Year</label>
                            <input type="text" class="form-control" id="modalYear" name="releaseYear" required
                                ng-model="modalAlbum.releaseYear" ng-pattern="/^[1-2]\d{3}$/">
                            <div class="form-text text-danger"
                                ng-show="albumForm.releaseYear.$invalid && albumForm.releaseYear.$touched">Valid year
                                required (e.g., 1990)</div>
                        </div>
                        <div class="mb-3">
                            <label for="modalGenre" class="form-label">Genre</label>
                            <input type="text" class="form-control" id="modalGenre" name="genre" required
                                ng-model="modalAlbum.genre">
                            <div class="form-text text-danger"
                                ng-show="albumForm.genre.$invalid && albumForm.genre.$touched">Genre is required</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" ng-disabled="albumForm.$invalid"
                        ng-click="saveModalAlbum()">OK</button>
                    <button class="btn btn-secondary" ng-click="closeModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-backdrop fade" ng-class="{'show': showModal}" ng-show="showModal"></div>
</div>
