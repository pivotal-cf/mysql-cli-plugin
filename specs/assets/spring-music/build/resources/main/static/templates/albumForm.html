<div class="modal-header">
    <h4 class="modal-title" ng-show="albumAction === 'add'">Add an album</h4>
    <h4 class="modal-title" ng-show="albumAction === 'update'">Edit an album</h4>
    <button type="button" class="btn-close" ng-click="cancel()" aria-label="Close"></button>
</div>
<div class="modal-body">
    <form name="albumForm" role="form">
        <div class="mb-3" ng-class="{'has-warning': albumForm.title.$invalid, 'has-success': albumForm.title.$valid}">
            <label for="title" class="form-label">Album Title</label>
            <input type="text" class="form-control" id="title" name="title" required ng-model="album.title">
            <div class="form-text text-danger" ng-show="albumForm.title.$invalid">Title is required</div>
        </div>
        <div class="mb-3" ng-class="{'has-warning': albumForm.artist.$invalid, 'has-success': albumForm.artist.$valid}">
            <label for="artist" class="form-label">Artist</label>
            <input type="text" class="form-control" id="artist" name="artist" required ng-model="album.artist">
            <div class="form-text text-danger" ng-show="albumForm.artist.$invalid">Artist is required</div>
        </div>
        <div class="mb-3"
            ng-class="{'has-warning': albumForm.releaseYear.$invalid, 'has-success': albumForm.releaseYear.$valid}">
            <label for="releaseYear" class="form-label">Release Year</label>
            <input type="text" class="form-control" id="releaseYear" name="releaseYear" required
                ng-model="album.releaseYear" ng-pattern="yearPattern">
            <div class="form-text text-danger" ng-show="albumForm.releaseYear.$invalid">Valid year required (e.g., 1990)
            </div>
        </div>
        <div class="mb-3" ng-class="{'has-warning': albumForm.genre.$invalid, 'has-success': albumForm.genre.$valid}">
            <label for="genre" class="form-label">Genre</label>
            <input type="text" class="form-control" id="genre" name="genre" required ng-model="album.genre">
            <div class="form-text text-danger" ng-show="albumForm.genre.$invalid">Genre is required</div>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button class="btn btn-primary" ng-disabled="albumForm.$invalid" ng-click="ok()">OK</button>
    <button class="btn btn-secondary" ng-click="cancel()">Cancel</button>
</div>
