<div class="col-6 col-sm-4 col-md-3 col-lg-3 mb-4" ng-repeat="album in albums | orderBy:sortField:sortDescending">
    <div class="card h-100">
        <div class="card-body">
            <h5 class="card-title">
                <in-place-edit field-name='title' input-type='text' input-class='form-control form-control-sm'
                    model=album>{{album.title}}</in-place-edit>
            </h5>

            <h6 class="card-subtitle mb-2 text-muted">
                <in-place-edit field-name='artist' input-type='text' input-class='form-control form-control-sm'
                    model=album>{{album.artist}}</in-place-edit>
            </h6>

            <p class="card-text">
                <small class="text-muted">
                    <in-place-edit field-name='releaseYear' input-type='text' input-class='form-control form-control-sm'
                        model=album>{{album.releaseYear}}</in-place-edit>
                </small>
            </p>

            <p class="card-text">
                <span class="badge bg-secondary">
                    <in-place-edit field-name='genre' input-type='text' input-class='form-control form-control-sm'
                        model=album>{{album.genre}}</in-place-edit>
                </span>
            </p>

            <div class="dropdown position-relative" bootstrap-dropdown>
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <span class="glyphicon glyphicon-cog"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" ng-click="updateAlbum(album)">Edit</a></li>
                    <li><a class="dropdown-item" href="#" ng-click="deleteAlbum(album)">Delete</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>
